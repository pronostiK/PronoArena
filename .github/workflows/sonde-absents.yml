name: Sonde absents (Bzzoiro, temporaire)
# Test du 19/11/2026, à supprimer après lecture. N'affiche que des comptes et des clés (dépôt public).
on:
  push:
    branches: [claude/project-thread-9deubo]
    paths: [test/lab/sonde_absents_bzzoiro.py, .github/workflows/sonde-absents.yml]
permissions:
  contents: read
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - env:
          BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
        run: python3 test/lab/sonde_absents_bzzoiro.py
